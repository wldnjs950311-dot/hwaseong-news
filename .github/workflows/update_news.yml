name: Hwaseong News Pipeline

on:
  # 외부 cron-job(cron-job.org 등)을 통한 스케줄링 관리 (깃허브 자체 예약 실행 비활성화)
  workflow_dispatch: # 외부 웹훅 및 수동 즉시 실행 가능

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 라이브러리 설치
        run: |
          pip install requests google-genai beautifulsoup4

      - name: 뉴스 수집 및 분석 가공
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python collector.py

      - name: 갱신된 news_data.json 자동 커밋 및 푸시
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add news_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: news_data.json" && git push)
