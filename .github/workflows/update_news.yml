name: Hwaseong News Pipeline

on:
  schedule:
    # 1. KST 07:00, 08:00 (평일 월~금)
    - cron: '0 22,23 * * 0-4'
    # 2. KST 09:00, 10:00 및 12:00~20:00 격시간 (평일 월~금)
    - cron: '0 0,1,3,5,7,9,11 * * 1-5'
  workflow_dispatch: # 언제든 수동 즉시 실행 가능

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 라이브러리 설치
        run: |
          pip install requests google-genai beautifulsoup4

      - name: 뉴스 수집 및 분석 가공
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python collector.py

      - name: 갱신된 news_data.json 자동 커밋 및 푸시
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add news_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: news_data.json" && git push)
