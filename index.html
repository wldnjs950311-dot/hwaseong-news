<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>화성특례시 언론 모니터링</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
    .badge-policy { background-color: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .badge-culture { background-color: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    .badge-risk { background-color: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .tab-active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 700; }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen pb-20">

  <!-- 상단 네비게이션 헤더 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-xl">🏛️</span>
        <h1 class="text-lg font-bold text-slate-900 tracking-tight">화성특례시 언론 모니터링</h1>
      </div>
      <div class="flex items-center space-x-2 text-xs text-slate-500">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span id="updated-at">업데이트 확인중...</span>
      </div>
    </div>
  </header>

  <!-- 메인 컨테이너 -->
  <main class="max-w-4xl mx-auto px-4 mt-6">
    
    <!-- 통계 카드 -->
    <div class="grid grid-cols-4 gap-2 mb-6 text-center">
      <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs text-slate-500 font-medium">전체 이슈</div>
        <div id="stat-total" class="text-lg font-bold text-slate-900 mt-1">-</div>
      </div>
      <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs text-blue-600 font-medium">시정·정책</div>
        <div id="stat-policy" class="text-lg font-bold text-blue-600 mt-1">-</div>
      </div>
      <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs text-emerald-600 font-medium">문화·행사</div>
        <div id="stat-culture" class="text-lg font-bold text-emerald-600 mt-1">-</div>
      </div>
      <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs text-rose-600 font-medium">리스크·지적</div>
        <div id="stat-risk" class="text-lg font-bold text-rose-600 mt-1">-</div>
      </div>
    </div>

    <!-- 카테고리 탭 (홈 / 시정정책 / 문화행사 / 리스크지적) -->
    <div class="flex border-b border-slate-200 bg-white rounded-t-xl px-2 shadow-sm mb-6">
      <button onclick="setTab('ALL')" id="tab-ALL" class="tab-btn px-4 py-3 text-sm text-slate-600 font-medium tab-active transition">
        전체(홈)
      </button>
      <button onclick="setTab('POLICY')" id="tab-POLICY" class="tab-btn px-4 py-3 text-sm text-slate-600 font-medium transition">
        시정·정책
      </button>
      <button onclick="setTab('CULTURE')" id="tab-CULTURE" class="tab-btn px-4 py-3 text-sm text-slate-600 font-medium transition">
        문화·행사
      </button>
      <button onclick="setTab('RISK')" id="tab-RISK" class="tab-btn px-4 py-3 text-sm text-slate-600 font-medium transition">
        리스크·지적
      </button>
    </div>

    <!-- 1. 주요 보도 및 다중 이슈 섹션 (홈 탭에서만 보임) -->
    <section id="major-section" class="mb-8">
      <div class="flex items-center justify-between mb-3 px-1">
        <div class="flex items-center space-x-2">
          <span class="text-base text-amber-500">⭐</span>
          <h2 class="text-base font-bold text-slate-900">주요 보도 및 다중 이슈</h2>
          <span id="major-badge" class="text-xs bg-amber-100 text-amber-800 font-semibold px-2 py-0.5 rounded-full">0</span>
        </div>
      </div>
      
      <div id="major-container" class="space-y-4">
        <!-- 주요 카드 주입 (첨부 이미지 스타일) -->
      </div>
    </section>

    <!-- 2. 실시간 뉴스 섹션 (탭 변경 시 해당 카테고리만 필터링) -->
    <section>
      <div class="flex items-center justify-between mb-3 px-1">
        <div class="flex items-center space-x-2">
          <span class="text-base text-blue-500">⏱️</span>
          <h2 id="realtime-title" class="text-base font-bold text-slate-900">실시간 언론 동향</h2>
          <span id="realtime-badge" class="text-xs bg-blue-100 text-blue-800 font-semibold px-2 py-0.5 rounded-full">0</span>
        </div>
      </div>

      <div id="realtime-container" class="space-y-4">
        <!-- 실시간 기사 카드 주입 -->
      </div>
    </section>

  </main>

  <script>
    let allArticles = [];
    let currentTab = 'ALL';

    // 탭 전환 처리
    function setTab(tabName) {
      currentTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('tab-active'));
      document.getElementById(`tab-${tabName}`).classList.add('tab-active');

      const majorSection = document.getElementById('major-section');
      const realtimeTitle = document.getElementById('realtime-title');

      if (tabName === 'ALL') {
        majorSection.classList.remove('hidden');
        realtimeTitle.textContent = "실시간 언론 동향";
      } else {
        // 개별 탭 선택 시 주요보도 섹션 숨김 (요청 반영)
        majorSection.classList.add('hidden');
        const titles = { 'POLICY': '시정·정책 실시간 뉴스', 'CULTURE': '문화·행사 실시간 뉴스', 'RISK': '리스크·지적 실시간 뉴스' };
        realtimeTitle.textContent = titles[tabName] || "실시간 뉴스";
      }

      renderArticles();
    }

    // 카드 렌더링 (제시해주신 이미지 스타일 100% 일치)
    function createCardHTML(article) {
      const deptLabel = article.dept_label || "참고부서";
      const mediaSummary = article.media_summary || article.media;

      // 1. 하위 관련 기사 목록 (들여쓰기 및 클릭 이동)
      let relatedTitlesHTML = '';
      if (article.related_articles && article.related_articles.length > 0) {
        relatedTitlesHTML = article.related_articles.map(r => `
          <div class="pl-5 text-sm text-slate-600 hover:text-blue-600 truncate py-0.5">
            <a href="${r.link}" target="_blank" class="hover:underline flex items-center">
              <span class="text-slate-400 mr-2">↳</span>
              <span class="truncate">${r.title}...</span>
            </a>
          </div>
        `).join('');
      }

      // 2. 3줄 요약 불릿
      const bulletsHTML = (article.bullets || []).map(b => {
        const cleanB = b.replace(/^[-*•]\s*/, '');
        return `<li class="flex items-start text-sm text-slate-700 leading-relaxed">
                  <span class="mr-2 font-bold text-slate-500">-</span>
                  <span>${cleanB}</span>
                </li>`;
      }).join('');

      // 3. 카드 전체 구조 (이미지와 완벽 일치: 상단대표제목 -> 들여쓰기타사제목 -> 3줄요약 -> 하단 소관/언론사외N곳)
      return `
        <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm hover:shadow transition">
          <!-- 대표 기사 제목 -->
          <h3 class="text-base font-bold text-slate-900 hover:text-blue-600 leading-snug mb-2">
            <a href="${article.link}" target="_blank">${article.title}</a>
          </h3>

          <!-- 동일 이슈 다른 기사 제목들 (들여쓰기) -->
          ${relatedTitlesHTML ? `<div class="mb-3 space-y-1">${relatedTitlesHTML}</div>` : ''}

          <!-- 3줄 핵심 요약 불릿 -->
          <div class="bg-slate-50/60 rounded-lg p-3.5 border border-slate-100 my-3">
            <ul class="space-y-1.5">
              ${bulletsHTML}
            </ul>
          </div>

          <!-- 카드 하단 바 (좌측: 소관/참고부서, 우측: 언론사 외 N곳) -->
          <div class="flex items-center justify-between text-xs pt-2 text-slate-600">
            <div>
              <span class="font-medium">${deptLabel}:</span> 
              <strong class="text-slate-800 font-semibold ml-1">${article.department || '확인중'}</strong>
            </div>
            <div class="font-medium text-slate-600">
              ${mediaSummary}
            </div>
          </div>
        </div>
      `;
    }

    function renderArticles() {
      const majorContainer = document.getElementById('major-container');
      const realtimeContainer = document.getElementById('realtime-container');

      // 주요 보도: 다중 기사 묶음이거나 리스크
      const majorArticles = allArticles.filter(a => a.is_major);

      // 실시간 뉴스: 홈 탭에서는 주요 뉴스를 제외한 실시간 기사만, 개별 탭에서는 해당 카테고리 전체
      let realtimeArticles = [];
      if (currentTab === 'ALL') {
        realtimeArticles = allArticles.filter(a => !a.is_major);
      } else {
        realtimeArticles = allArticles.filter(a => a.category === currentTab);
      }

      document.getElementById('major-badge').textContent = majorArticles.length;
      document.getElementById('realtime-badge').textContent = realtimeArticles.length;

      // 주요 보도 렌더링
      if (majorArticles.length > 0) {
        majorContainer.innerHTML = majorArticles.map(a => createCardHTML(a)).join('');
      } else {
        majorContainer.innerHTML = `<div class="text-center py-6 text-xs text-slate-400 bg-white rounded-xl border border-slate-200">현재 다중 집중 보도가 없습니다.</div>`;
      }

      // 실시간 뉴스 렌더링
      if (realtimeArticles.length > 0) {
        realtimeContainer.innerHTML = realtimeArticles.map(a => createCardHTML(a)).join('');
      } else {
        realtimeContainer.innerHTML = `<div class="text-center py-6 text-xs text-slate-400 bg-white rounded-xl border border-slate-200">등록된 뉴스가 없습니다.</div>`;
      }
    }

    async function loadNewsData() {
      try {
        const res = await fetch('./news_data.json?v=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error("JSON 불러오기 실패");
        const data = await res.json();

        allArticles = data.articles || [];

        document.getElementById('updated-at').textContent = `최근 갱신: ${data.updated_at || ''}`;
        document.getElementById('stat-total').textContent = `${data.stats.total || 0}건`;
        document.getElementById('stat-policy').textContent = `${data.stats.policy || 0}건`;
        document.getElementById('stat-culture').textContent = `${data.stats.culture || 0}건`;
        document.getElementById('stat-risk').textContent = `${data.stats.risk || 0}건`;

        renderArticles();
      } catch (err) {
        console.error(err);
        document.getElementById('updated-at').textContent = "데이터 로딩 오류";
      }
    }

    loadNewsData();
  </script>
</body>
</html>
