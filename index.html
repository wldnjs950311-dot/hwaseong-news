<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>화성시 언론 모니터링 대시보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
    .badge-policy { background-color: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .badge-culture { background-color: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    .badge-risk { background-color: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .accordion-content { transition: max-height 0.3s ease-out, opacity 0.2s ease-out; }
    .rotate-180 { transform: rotate(180deg); }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen pb-16">

  <!-- 네비게이션 헤더 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-xl">🏛️</span>
        <h1 class="text-lg font-bold text-slate-900 tracking-tight">화성특례시 언론 모니터링</h1>
      </div>
      <div class="flex items-center space-x-2 text-xs text-slate-500">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span id="updated-at">업데이트 확인중...</span>
      </div>
    </div>
  </header>

  <!-- 메인 컨테이너 -->
  <main class="max-w-4xl mx-auto px-4 mt-6">
    
    <!-- 상단 통계 카드 -->
    <div class="grid grid-cols-4 gap-2 mb-6 text-center">
      <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs text-slate-500 font-medium">전체 이슈</div>
        <div id="stat-total" class="text-lg font-bold text-slate-900 mt-1">-</div>
      </div>
      <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs text-blue-600 font-medium">시정·정책</div>
        <div id="stat-policy" class="text-lg font-bold text-blue-600 mt-1">-</div>
      </div>
      <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs text-emerald-600 font-medium">문화·행사</div>
        <div id="stat-culture" class="text-lg font-bold text-emerald-600 mt-1">-</div>
      </div>
      <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs text-rose-600 font-medium">리스크·지적</div>
        <div id="stat-risk" class="text-lg font-bold text-rose-600 mt-1">-</div>
      </div>
    </div>

    <!-- 1. 주요 뉴스 섹션 (아코디언 토글 가능) -->
    <section class="mb-8">
      <div onclick="toggleSection('major-container', 'major-icon')" 
           class="flex items-center justify-between bg-white px-4 py-3 rounded-xl border border-slate-200 cursor-pointer shadow-sm hover:bg-slate-50 transition select-none">
        <div class="flex items-center space-x-2">
          <span class="text-base text-amber-500">⭐</span>
          <h2 class="text-base font-bold text-slate-900">주요 보도 및 다중 이슈</h2>
          <span id="major-badge" class="ml-2 text-xs bg-amber-100 text-amber-800 font-semibold px-2 py-0.5 rounded-full">0</span>
        </div>
        <div class="flex items-center space-x-1 text-xs text-slate-400">
          <span>접기/펼치기</span>
          <i id="major-icon" class="fa-solid fa-chevron-up transition-transform duration-200"></i>
        </div>
      </div>
      
      <div id="major-container" class="space-y-4 mt-3">
        <!-- 주요 기사 카드 주입 -->
      </div>
    </section>

    <!-- 2. 실시간 전체 뉴스 섹션 (아코디언 토글 가능) -->
    <section>
      <div onclick="toggleSection('realtime-container', 'realtime-icon')" 
           class="flex items-center justify-between bg-white px-4 py-3 rounded-xl border border-slate-200 cursor-pointer shadow-sm hover:bg-slate-50 transition select-none">
        <div class="flex items-center space-x-2">
          <span class="text-base text-blue-500">⏱️</span>
          <h2 class="text-base font-bold text-slate-900">실시간 언론 동향</h2>
          <span id="realtime-badge" class="ml-2 text-xs bg-blue-100 text-blue-800 font-semibold px-2 py-0.5 rounded-full">0</span>
        </div>
        <div class="flex items-center space-x-1 text-xs text-slate-400">
          <span>접기/펼치기</span>
          <i id="realtime-icon" class="fa-solid fa-chevron-up transition-transform duration-200"></i>
        </div>
      </div>

      <div id="realtime-container" class="space-y-4 mt-3">
        <!-- 일반 실시간 기사 카드 주입 -->
      </div>
    </section>

  </main>

  <script>
    // 섹션 전체 접기/펼치기 함수
    function toggleSection(containerId, iconId) {
      const container = document.getElementById(containerId);
      const icon = document.getElementById(iconId);
      if (container.classList.contains('hidden')) {
        container.classList.remove('hidden');
        icon.classList.remove('rotate-180');
      } else {
        container.classList.add('hidden');
        icon.classList.add('rotate-180');
      }
    }

    // 카드 내부 관련 기사 접기/펼치기 함수
    function toggleRelated(idx) {
      const el = document.getElementById(`related-${idx}`);
      const btn = document.getElementById(`btn-related-${idx}`);
      if (el.classList.contains('hidden')) {
        el.classList.remove('hidden');
        btn.innerHTML = `<i class="fa-solid fa-chevron-up mr-1"></i> 관련 기사 닫기`;
      } else {
        el.classList.add('hidden');
        btn.innerHTML = `<i class="fa-solid fa-chevron-down mr-1"></i> 관련 보도 ${el.dataset.count}건 더보기`;
      }
    }

    function createCardHTML(article, idx) {
      let badgeClass = "badge-policy";
      let badgeText = "시정·정책";
      if (article.category === "RISK") {
        badgeClass = "badge-risk";
        badgeText = "리스크·지적";
      } else if (article.category === "CULTURE") {
        badgeClass = "badge-culture";
        badgeText = "문화·행사";
      }

      const deptLabel = article.dept_label || "참고부서";
      const relatedCount = (article.related_articles || []).length;

      // 3줄 요약 불릿
      const bulletsHTML = (article.bullets || []).map(b => {
        const cleanB = b.replace(/^[-*•]\s*/, '');
        return `<li class="flex items-start text-sm text-slate-700 leading-relaxed">
                  <span class="text-blue-500 mr-2 font-bold">•</span>
                  <span>${cleanB}</span>
                </li>`;
      }).join('');

      // 관련 기사 아코디언 HTML
      let relatedHTML = '';
      if (relatedCount > 0) {
        const relatedItems = article.related_articles.map(r => `
          <li class="py-1.5 flex items-center justify-between text-xs border-b border-slate-100 last:border-none">
            <a href="${r.link}" target="_blank" class="text-slate-600 hover:text-blue-600 truncate max-w-[70%]">
              ${r.title}
            </a>
            <div class="flex items-center space-x-2 text-slate-400 shrink-0">
              <span>${r.media}</span>
              <span>${r.time_label || ''}</span>
            </div>
          </li>
        `).join('');

        relatedHTML = `
          <div class="mt-3 pt-2 border-t border-slate-100">
            <button id="btn-related-${idx}" onclick="toggleRelated(${idx})" class="text-xs text-blue-600 font-medium hover:underline flex items-center">
              <i class="fa-solid fa-chevron-down mr-1"></i> 관련 보도 ${relatedCount}건 더보기
            </button>
            <ul id="related-${idx}" data-count="${relatedCount}" class="hidden mt-2 bg-slate-50 p-2.5 rounded-lg border border-slate-100">
              ${relatedItems}
            </ul>
          </div>
        `;
      }

      return `
        <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm hover:shadow transition">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center space-x-2">
              <span class="text-xs px-2 py-0.5 rounded-md font-semibold ${badgeClass}">${badgeText}</span>
              <span class="text-xs text-slate-400">${article.time_label || ''}</span>
              <span class="text-xs font-medium text-slate-500">${article.media}</span>
            </div>
            <a href="${article.link}" target="_blank" class="text-slate-400 hover:text-blue-600 text-xs flex items-center">
              원문 <i class="fa-solid fa-arrow-up-right-from-square ml-1"></i>
            </a>
          </div>

          <h3 class="text-base font-bold text-slate-900 mb-3 hover:text-blue-600 leading-snug">
            <a href="${article.link}" target="_blank">${article.title}</a>
          </h3>

          <div class="bg-slate-50/70 rounded-lg p-3 border border-slate-100 mb-3">
            <ul class="space-y-1.5">
              ${bulletsHTML}
            </ul>
          </div>

          <div class="flex items-center justify-between text-xs">
            <span class="bg-slate-100 text-slate-600 px-2 py-1 rounded font-medium">
              ${deptLabel}: <strong class="text-slate-800 font-semibold">${article.department || '확인중'}</strong>
            </span>
          </div>

          ${relatedHTML}
        </div>
      `;
    }

    async function loadNewsData() {
      try {
        // 캐시 무시 강제 실시간 파싱
        const res = await fetch('./news_data.json?v=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error("JSON 로드 실패");
        const data = await res.json();

        document.getElementById('updated-at').textContent = `최근 갱신: ${data.updated_at || ''}`;
        document.getElementById('stat-total').textContent = `${data.stats.total || 0}건`;
        document.getElementById('stat-policy').textContent = `${data.stats.policy || 0}건`;
        document.getElementById('stat-culture').textContent = `${data.stats.culture || 0}건`;
        document.getElementById('stat-risk').textContent = `${data.stats.risk || 0}건`;

        const articles = data.articles || [];
        const majorArticles = articles.filter(a => a.is_major);
        const realtimeArticles = articles.filter(a => !a.is_major);

        document.getElementById('major-badge').textContent = majorArticles.length;
        document.getElementById('realtime-badge').textContent = realtimeArticles.length;

        const majorContainer = document.getElementById('major-container');
        const realtimeContainer = document.getElementById('realtime-container');

        if (majorArticles.length > 0) {
          majorContainer.innerHTML = majorArticles.map((a, i) => createCardHTML(a, `m-${i}`)).join('');
        } else {
          majorContainer.innerHTML = `<div class="text-center py-6 text-xs text-slate-400 bg-white rounded-xl border border-slate-200">현재 집중된 주요 다중 보도가 없습니다.</div>`;
        }

        if (realtimeArticles.length > 0) {
          realtimeContainer.innerHTML = realtimeArticles.map((a, i) => createCardHTML(a, `r-${i}`)).join('');
        } else {
          realtimeContainer.innerHTML = `<div class="text-center py-6 text-xs text-slate-400 bg-white rounded-xl border border-slate-200">등록된 실시간 단신이 없습니다.</div>`;
        }

      } catch (err) {
        console.error(err);
        document.getElementById('updated-at').textContent = "데이터 갱신 중...";
      }
    }

    loadNewsData();
  </script>
</body>
</html>
